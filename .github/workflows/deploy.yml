name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # the manual "Run workflow" button — use this after editing the Sheet

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pulls lecture data from the published Google Sheet when SHEET_CSV_URL is
      # configured (Settings > Secrets and variables > Actions > Variables).
      # Without it, the committed catalogue is used. A malformed Sheet fails here.
      - name: Sync content from Google Sheet
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: node scripts/sync-sheet.mjs

      - name: Type check
        run: npx astro check

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}   # unset → /nobel, see astro.config.mjs
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
