name: Cut backdrop clips

# The clips that loop behind the halls are cut from the lecture recordings.
# Cut them LOCALLY with scripts/make-backdrop-clips.py — the working machine
# reaches googlevideo.com. This workflow is kept only as a fallback and does
# not currently work: a runner is a datacenter address, and YouTube answers
# it with "sign in to confirm you're not a bot" on every player client.
#
# Manual only. Run it after changing CLIPS in scripts/make-backdrop-clips.py,
# not on every push — it downloads from YouTube and rewrites binaries.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Length of each clip in seconds
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: backdrop-clips
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Cut and encode
        env:
          CLIP_SECONDS: ${{ inputs.seconds }}
        run: |
          mkdir -p .tools
          ln -sf "$(command -v ffmpeg)" .tools/ffmpeg
          ln -sf "$(command -v ffprobe)" .tools/ffprobe
          python3 scripts/make-backdrop-clips.py

      - name: Show what was produced
        run: |
          ls -la public/media/backdrop/
          cat src/data/backdrop.json

      - name: Commit the clips
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f public/media/backdrop src/data/backdrop.json
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          git commit -m "$(printf 'cut the backdrop clips\n\nGenerated by .github/workflows/backdrop-clips.yml from\nscripts/make-backdrop-clips.py.')"
          git push
