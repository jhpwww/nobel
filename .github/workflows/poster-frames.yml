name: Cut poster frames

# The still that represents a session has to be a picture of the laureate.
# For most of the collection one of the four frames YouTube samples will do,
# and scripts/pick-posters.py verifies which — but for ten of them none of the
# four holds the laureate at all: what they hold is the host, the introducer,
# a title card, and in one case a string quartet. Those have to be cut out of
# the recording itself.
#
# Which cannot happen on the machine this site is worked on: that network
# routes googlevideo.com to a TANet edge that refuses 443, so yt-dlp reaches
# YouTube's metadata there and never its media. A runner has open internet.
# Same reason the backdrop clips are cut here.
#
# Manual only. It reads from YouTube and commits binaries back.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'YouTube ids to do, comma separated (blank = every session that still needs one)'
        required: false
        default: ''
      redo:
        description: 'Cut every target again, including ones already done'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: poster-frames
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp, ffmpeg and OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp opencv-python-headless numpy
          ffmpeg -version | head -1
          yt-dlp --version

      # The two OpenCV Zoo models the recognition runs on. They are 39 MB
      # together and are not in the repository — .tools/ is ignored — so they
      # are fetched at a pinned commit rather than from main, which would let
      # a model change silently change which frame is chosen.
      - name: Fetch the face models
        run: |
          mkdir -p .tools
          # media.githubusercontent.com, not raw: the zoo keeps its weights in
          # Git LFS, and raw hands back the 130-byte pointer file instead of
          # the model. Pinned to a commit rather than to main so that a new
          # model cannot silently change which frame is chosen — and the two
          # digests are the ones the local .tools/ models carry, so a run here
          # recognises faces exactly as a run on the working machine does.
          base='https://media.githubusercontent.com/media/opencv/opencv_zoo/f12e12798e8314f7c074a6656816c048dcc95b7a'
          curl -sL -o .tools/yunet.onnx \
            "$base/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          curl -sL -o .tools/sface.onnx \
            "$base/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"
          echo '8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  .tools/yunet.onnx' > .tools/SHA256
          echo '0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  .tools/sface.onnx' >> .tools/SHA256
          sha256sum -c .tools/SHA256

      - name: Cut the stills
        env:
          ONLY: ${{ inputs.only }}
          REDO: ${{ inputs.redo }}
        run: |
          args=''
          if [ -n "$ONLY" ]; then args="--only $ONLY"; fi
          if [ "$REDO" = 'true' ]; then args="$args --all"; fi
          python3 scripts/cut-poster-frames.py $args

      - name: Show what was produced
        run: |
          ls -la public/assets/posters/ 2>/dev/null || echo 'nothing cut'
          cat src/data/local-posters.json

      - name: Commit the stills
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f public/assets/posters src/data/local-posters.json
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          git commit -m "$(printf 'cut the stills that show the laureate\n\nGenerated by .github/workflows/poster-frames.yml — the working machine\ncannot reach googlevideo.com, so the cutting runs here. Each frame is one\nthe laureate was recognised in against their official portrait; see\nscripts/cut-poster-frames.py.')"
          git push
